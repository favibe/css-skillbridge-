<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Preview Card Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="product-preview.css" />
</head>
<body>

  <main class="card">
    <!-- Responsive image swapping -->
    <picture class="card-image">
  <img src="https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&w=600&q=80" alt="Gabrielle Essence Eau De Parfum bottle">
</picture>


    <div class="card-content">
      <p class="category">Perfume</p>
      <h1 class="title">Gabrielle Essence Eau De Parfum</h1>
      <p class="description">
        A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.
      </p>
      
      <div class="price-container">
        <span class="current-price">$149.99</span>
        <span class="original-price">$169.99</span>
      </div>

      <button class="add-to-cart-btn">
        <svg width="15" height="16" xmlns="http://www.w3.org/2000/svg">
          <path d="M14.373 4.571a.524.524 0 0 0-.437-.255H3.474l-.24-1.2A.523.523 0 0 0 2.72 2.7H.525A.525.525 0 0 0 0 3.225v.525c0 .29.235.525.525.525h1.761l1.632 8.164a.523.523 0 0 0 .513.422h8.398a.524.524 0 0 0 .513-.422l1.2-6a.523.523 0 0 0-.17-.468zM4.301 11.55l-1.04-5.2h9.762l-1.04 5.2H4.301zM4.725 14.7a1.05 1.05 0 1 1 2.1 0 1.05 1.05 0 0 1-2.1 0zm6.3 0a1.05 1.05 0 1 1 2.1 0 1.05 1.05 0 0 1-2.1 0z" fill="#FFF"/>
        </svg>
        Add to Cart
      </button>
    </div>
  </main>

</body>
</html>
